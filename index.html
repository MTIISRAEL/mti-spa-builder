const getModelMaxDimensionMm = (dimensionsStr: string) => {
  const nums = dimensionsStr.match(/\d+/g);
  if (!nums) return 2050;
  const maxCm = Math.max(...nums.map(Number));
  return maxCm * 10;
};

  { id: 'pu-mled-9', type: 'mini-led', label: 'מיני לד', diameterMm: 20.0, shape: 'circle', color: '#15803d', x: 175, y: 605 },
  { id: 'pu-mled-10', type: 'mini-led', label: 'מיני לד', diameterMm: 20.0, shape: 'circle', color: '#15803d', x: 68, y: 570 },
  { id: 'pu-mled-11', type: 'mini-led', label: 'מיני לד', diameterMm: 20.0, shape: 'circle', color: '#15803d', x: 60, y: 220 },
];

function SpaProductionPage() {
  const [activeTab, setActiveTab] = useState<'sales' | 'production' | 'warehouse' | 'archive' | 'presets'>('sales');

  const [orders, setOrders] = useState<OrderData[]>([]);
  const [presets, setPresets] = useState<Record<string, PlacedItem[]>>({});

  const [editingOrderId, setEditingOrderId] = useState<string | null>(null);
  const [customerName, setCustomerName] = useState('');
  const [customerAddress, setCustomerAddress] = useState('');
  const [customerPhone, setCustomerPhone] = useState('');
  const [serialDigits, setSerialDigits] = useState('');
  const [selectedModelId, setSelectedModelId] = useState(MODELS[1].id);
  const [selectedEquipmentSku, setSelectedEquipmentSku] = useState(MODELS[1].equipments[0].sku);
  const [modelSearch, setModelSearch] = useState('');
  const [selectedAcrylicCode, setSelectedAcrylicCode] = useState(ACRYLIC_COLORS[0].code);
  const [selectedCabinet, setSelectedCabinet] = useState(CABINET_COLORS[0].id);
  const [selectedPhase, setSelectedPhase] = useState<'single' | 'three'>('three');
  const [installationType, setInstallationType] = useState<'above-ground' | 'semi-inground' | 'fully-inground'>('above-ground');
  const [selectedAccessories, setSelectedAccessories] = useState<string[]>([]);
  const [lightedSidesCount, setLightedSidesCount] = useState<number>(0);
  const [salesNotes, setSalesNotes] = useState<string>('');
  const [zoomImage, setZoomImage] = useState<string | null>(null);

  const [placedItems, setPlacedItems] = useState<PlacedItem[]>([]);
  const [selectedItemId, setSelectedItemId] = useState<string | null>(null);
  const [modelImageSrc, setModelImageSrc] = useState<string>(`models/TOP-VIEW/${MODELS[1].id}.jpeg`);

  const [presetModelId, setPresetModelId] = useState(MODELS[1].id);
  const [presetEquipmentSku, setPresetEquipmentSku] = useState(MODELS[1].equipments[0].sku);
  const [presetPlacedItems, setPresetPlacedItems] = useState<PlacedItem[]>([]);
  const [presetSelectedItemId, setPresetSelectedItemId] = useState<string | null>(null);
  const [presetModelImageSrc, setPresetModelImageSrc] = useState<string>(`models/TOP-VIEW/${MODELS[1].id}.jpeg`);

  const getLayoutFor = (mId: string, sku: string, currentPresets: Record<string, PlacedItem[]>): PlacedItem[] => {
    const key = getPresetKey(mId, sku);
    if (currentPresets && currentPresets[key]) {
      return currentPresets[key].map(item => ({ ...item, id: `item-${Date.now()}-${Math.random()}` }));
    }
    if (sku === 'CUSTOM') {
      return generateFallbackLayout();
    }
    if (mId === '30101' && sku === '30115') {
      return POLARIS_URBAN_PRESET.map(item => ({ ...item, id: `item-${Date.now()}-${Math.random()}` }));
    }
    return POLARIS_URBAN_PRESET.map(item => ({ ...item, id: `item-${Date.now()}-${Math.random()}` }));
  };

  useEffect(() => {
    const savedOrders = localStorage.getItem('mes_spa_orders');
    if (savedOrders) {
      try { setOrders(JSON.parse(savedOrders)); } catch (e) { console.error(e); }
    }
    let loadedPresets: Record<string, PlacedItem[]> = {};
    const savedPresets = localStorage.getItem('mes_spa_presets');
    if (savedPresets) {
      try { loadedPresets = JSON.parse(savedPresets); setPresets(loadedPresets); } catch (e) { console.error(e); }
    }
    const initial = getLayoutFor(MODELS[1].id, MODELS[1].equipments[0].sku, loadedPresets);
    setPlacedItems(initial);
    setPresetPlacedItems(initial);
  }, []);

  useEffect(() => {
    const testExtensions = ['jpeg', 'jpg', 'png', 'webp'];
    let found = false;
    testExtensions.forEach((ext) => {
      const testImg = new window.Image();
      testImg.src = `models/TOP-VIEW/${selectedModelId}.${ext}`;
      testImg.onload = () => { if (!found) { found = true; setModelImageSrc(`models/TOP-VIEW/${selectedModelId}.${ext}`); } };
    });
  }, [selectedModelId]);

  useEffect(() => {
    const testExtensions = ['jpeg', 'jpg', 'png', 'webp'];
    let found = false;
    testExtensions.forEach((ext) => {
      const testImg = new window.Image();
      testImg.src = `models/TOP-VIEW/${presetModelId}.${ext}`;
      testImg.onload = () => { if (!found) { found = true; setPresetModelImageSrc(`models/TOP-VIEW/${presetModelId}.${ext}`); } };
    });
  }, [presetModelId]);

  const svgRef = useRef<SVGSVGElement | null>(null);
  const [draggingId, setDraggingId] = useState<string | null>(null);
  const [dragOffset, setDragOffset] = useState({ x: 0, y: 0 });

  const presetSvgRef = useRef<SVGSVGElement | null>(null);
  const [presetDraggingId, setPresetDraggingId] = useState<string | null>(null);
  const [presetDragOffset, setPresetDragOffset] = useState({ x: 0, y: 0 });

  useEffect(() => {
    const handleKeyDown = (e: KeyboardEvent) => {
      if (e.key === 'Delete' || e.key === 'Backspace') {
        const activeTag = document.activeElement?.tagName.toLowerCase();
        if (activeTag === 'input' || activeTag === 'textarea') return;

        if (activeTab === 'production' && selectedItemId) {
          setPlacedItems(prev => prev.filter(it => it.id !== selectedItemId));
          setSelectedItemId(null);
        } else if (activeTab === 'presets' && presetSelectedItemId) {
          setPresetPlacedItems(prev => prev.filter(it => it.id !== presetSelectedItemId));
          setPresetSelectedItemId(null);
        }
      }
    };
    window.addEventListener('keydown', handleKeyDown);
    return () => window.removeEventListener('keydown', handleKeyDown);
  }, [activeTab, selectedItemId, presetSelectedItemId]);

  const addJetToCanvas = (tool: typeof JETS_TOOLS[0]) => {
    const newItem: PlacedItem = {
      id: `item-${Date.now()}`, type: tool.type, label: tool.label, x: 320, y: 320,
      diameterMm: tool.diameterMm, widthMm: tool.widthMm, heightMm: tool.heightMm,
      shape: (tool.shape as 'circle' | 'oval' | 'rect') || 'circle', rotation: 0, color: tool.color
    };
    setPlacedItems(prev => [...prev, newItem]);
    setSelectedItemId(newItem.id);
  };

  const rotatePlacedItem = (id: string) => {
    setPlacedItems(prev => prev.map(it => it.id === id ? { ...it, rotation: ((it.rotation || 0) + 90) % 360 } : it));
  };

  const handlePointerDown = (item: PlacedItem, e: React.PointerEvent) => {
    e.stopPropagation(); setSelectedItemId(item.id); setDraggingId(item.id);
    if (svgRef.current) {
      const rect = svgRef.current.getBoundingClientRect();
      const scaleX = 640 / rect.width; const scaleY = 640 / rect.height;
      setDragOffset({ x: (e.clientX - rect.left) * scaleX - item.x, y: (e.clientY - rect.top) * scaleY - item.y });
    }
  };

  const handlePointerMove = (e: React.PointerEvent) => {
    if (!draggingId || !svgRef.current) return;
    const rect = svgRef.current.getBoundingClientRect();
    const scaleX = 640 / rect.width; const scaleY = 640 / rect.height;
    const mouseX = (e.clientX - rect.left) * scaleX; const mouseY = (e.clientY - rect.top) * scaleY;
    setPlacedItems(prev => prev.map(it => it.id === draggingId ? { ...it, x: Math.max(10, Math.min(630, mouseX - dragOffset.x)), y: Math.max(10, Math.min(630, mouseY - dragOffset.y)) } : it));
  };
  const handlePointerUp = () => setDraggingId(null);

  const addJetToPreset = (tool: typeof JETS_TOOLS[0]) => {
    const newItem: PlacedItem = {
      id: `preset-${Date.now()}`, type: tool.type, label: tool.label, x: 320, y: 320,
      diameterMm: tool.diameterMm, widthMm: tool.widthMm, heightMm: tool.heightMm,
      shape: (tool.shape as 'circle' | 'oval' | 'rect') || 'circle', rotation: 0, color: tool.color
    };
    setPresetPlacedItems(prev => [...prev, newItem]);
    setPresetSelectedItemId(newItem.id);
  };

  const rotatePresetItem = (id: string) => {
    setPresetPlacedItems(prev => prev.map(it => it.id === id ? { ...it, rotation: ((it.rotation || 0) + 90) % 360 } : it));
  };

  const handlePresetPointerDown = (item: PlacedItem, e: React.PointerEvent) => {
    e.stopPropagation(); setPresetSelectedItemId(item.id); setPresetDraggingId(item.id);
    if (presetSvgRef.current) {
      const rect = presetSvgRef.current.getBoundingClientRect();
      const scaleX = 640 / rect.width; const scaleY = 640 / rect.height;
      setPresetDragOffset({ x: (e.clientX - rect.left) * scaleX - item.x, y: (e.clientY - rect.top) * scaleY - item.y });
    }
  };
  const handlePresetPointerMove = (e: React.PointerEvent) => {
    if (!presetDraggingId || !presetSvgRef.current) return;
    const rect = presetSvgRef.current.getBoundingClientRect();
    const scaleX = 640 / rect.width; const scaleY = 640 / rect.height;
    const mouseX = (e.clientX - rect.left) * scaleX; const mouseY = (e.clientY - rect.top) * scaleY;
    setPresetPlacedItems(prev => prev.map(it => it.id === presetDraggingId ? { ...it, x: Math.max(10, Math.min(630, mouseX - presetDragOffset.x)), y: Math.max(10, Math.min(630, mouseY - presetDragOffset.y)) } : it));
  };
  const handlePresetPointerUp = () => setPresetDraggingId(null);

  const savePreset = () => {
    const key = getPresetKey(presetModelId, presetEquipmentSku);
    const updatedPresets = { ...presets, [key]: presetPlacedItems };
    setPresets(updatedPresets);
    localStorage.setItem('mes_spa_presets', JSON.stringify(updatedPresets));

    if (selectedModelId === presetModelId && selectedEquipmentSku === presetEquipmentSku) {
      setPlacedItems(presetPlacedItems.map(item => ({ ...item, id: `item-${Date.now()}-${Math.random()}` })));
    }
    alert('תבנית היצרן נשמרה בזיכרון וסונכרנה בהצלחה!');
  };

  const clearPresetCanvas = () => {
    if (confirm('האם לנקות את כל המשטח?')) {
      setPresetPlacedItems([]);
      setPresetSelectedItemId(null);
    }
  };

  const handleSerialChange = (e: React.ChangeEvent<HTMLInputElement>) => {
    const val = e.target.value.replace(/\D/g, '');
    if (val.length <= 4) setSerialDigits(val);
  };

  const handleModelSelect = (modelId: string) => {
    setSelectedModelId(modelId);
    const m = MODELS.find((item) => item.id === modelId);
    if (m) {
      const firstSku = m.equipments.length > 0 ? m.equipments[0].sku : '';
      if (firstSku) setSelectedEquipmentSku(firstSku);
      if (m.isSwimSpa) setSelectedAcrylicCode('MB-6427');
      setPlacedItems(getLayoutFor(modelId, firstSku, presets));
    }
  };

  const handleEquipmentSelect = (sku: string) => {
    setSelectedEquipmentSku(sku);
    setPlacedItems(getLayoutFor(selectedModelId, sku, presets));
  };

  const resetToStandardPreset = () => {
    if (confirm('האם לרענן ולטעון את הפריסה המקורית של האיבזור הזה?')) {
      setPlacedItems(getLayoutFor(selectedModelId, selectedEquipmentSku, presets));
      setSelectedItemId(null);
    }
  };

  const toggleAccessory = (id: string) => {
    setSelectedAccessories(prev => prev.includes(id) ? prev.filter(item => item !== id) : [...prev, id]);
  };

  const resetToNewOrder = () => {
    setEditingOrderId(null);
    setCustomerName('');
    setCustomerAddress('');
    setCustomerPhone('');
    setSerialDigits('');
    setSelectedModelId(MODELS[1].id);
    const defaultSku = MODELS[1].equipments[0].sku;
    setSelectedEquipmentSku(defaultSku);
    setSelectedAcrylicCode(ACRYLIC_COLORS[0].code);
    setSelectedCabinet(CABINET_COLORS[0].id);
    setSelectedPhase('three');
    setInstallationType('above-ground');
    setSelectedAccessories([]);
    setLightedSidesCount(0);
    setSalesNotes('');
    setPlacedItems(getLayoutFor(MODELS[1].id, defaultSku, presets));
    setActiveTab('sales');
  };

  const goToProduction = () => {
    if (serialDigits.length !== 4) {
      alert('נא להזין 4 ספרות למספר הג׳קוזי בשלב המכירתי לפני מעבר לשרטוט (אופציונלי)');
    }
    setActiveTab('production');
  };

  const handleSaveOrder = (status: 'draft' | 'final') => {
    if (!customerName.trim() || !customerAddress.trim() || !customerPhone.trim()) {
      alert('יש למלא שם לקוח, כתובת וטלפון לפני שמירת ההזמנה!');
      return;
    }
    if (status === 'final' && serialDigits.length !== 4) {
      alert('חובה להקצות מספר ספא תקין (4 ספרות) על ידי האיש הטכני לפני סגירת הפקודה לייצור!');
      return;
    }
    const orderToSave: OrderData = {
      id: editingOrderId || `order-${Date.now()}`,
      customerName: customerName.trim(), customerAddress: customerAddress.trim(), customerPhone: customerPhone.trim(),
      serialDigits: serialDigits || '',
      selectedModelId, selectedEquipmentSku, selectedAcrylicCode, selectedCabinet, selectedPhase,
      installationType, selectedAccessories, lightedSidesCount, salesNotes, placedItems, status, updatedAt: Date.now()
    };
    let updated = [...orders];
    if (editingOrderId) updated = updated.map(o => o.id === editingOrderId ? orderToSave : o);
    else { updated.push(orderToSave); setEditingOrderId(orderToSave.id); }
    setOrders(updated);
    localStorage.setItem('mes_spa_orders', JSON.stringify(updated));
    if (status === 'draft') alert('ההזמנה נשמרה כטיוטה בהצלחה!');
    else { alert(`פקודת עבודה לספא מס׳ ${serialDigits} נסגרה ואושרה לייצור בהצלחה!`); setActiveTab('archive'); }
  };

  const loadOrder = (order: OrderData) => {
    setEditingOrderId(order.id);
    setCustomerName(order.customerName || ''); setCustomerAddress(order.customerAddress || ''); setCustomerPhone(order.customerPhone || '');
    setSerialDigits(order.serialDigits); setSelectedModelId(order.selectedModelId); setSelectedEquipmentSku(order.selectedEquipmentSku); setSelectedAcrylicCode(order.selectedAcrylicCode); setSelectedCabinet(order.selectedCabinet); setSelectedPhase(order.selectedPhase);
    setInstallationType(order.installationType || 'above-ground');
    setSelectedAccessories(order.selectedAccessories); setLightedSidesCount(order.lightedSidesCount || 0);
    setSalesNotes(order.salesNotes || '');
    setPlacedItems(order.placedItems.length > 0 ? order.placedItems : getLayoutFor(order.selectedModelId, order.selectedEquipmentSku, presets));
    setActiveTab('sales');
  };

  const deleteOrder = (id: string) => {
    if (confirm('האם למחוק הזמנה זו מהארכיון?')) {
      const updated = orders.filter(o => o.id !== id);
      setOrders(updated); localStorage.setItem('mes_spa_orders', JSON.stringify(updated));
    }
  };

  const filteredModels = MODELS.filter(m => m.name.includes(modelSearch) || m.id.includes(modelSearch) || m.dimensions.includes(modelSearch));
  const currentModelObj = MODELS.find(m => m.id === selectedModelId);
  const currentEquipmentObj = currentModelObj?.equipments.find(eq => eq.sku === selectedEquipmentSku) || currentModelObj?.equipments[0];
  const currentAcrylicObj = ACRYLIC_COLORS.find(a => a.code === selectedAcrylicCode);
  const currentCabinetObj = CABINET_COLORS.find(c => c.id === selectedCabinet);
  const fullSpaTitle = serialDigits ? `ספא מס' ${serialDigits}` : 'טרם הוקצה מספר ספא';

  // תמונת היטל צד אמיתית לפי השילוב שנבחר. יש לנו כרגע רק שני צילומים אמיתיים
  // (קליפה לבן שיש + חיפוי שחור פסים לאורך; וחיפוי עץ בהיר פסים לרוחב) — לכל שילוב
  // אחר מוצג הצילום הכללי של אותה סדרת חיפוי (קלאסית/אופקית), לא הגוון המדויק.
  const comboPreviewImage =
    currentCabinetObj?.series === 'classic' ? 'models/cabinets/hero-classic.jpeg' :
    currentCabinetObj?.series === 'horizontal' ? 'models/cabinets/hero-horizontal.jpeg' :
    null;
  const availableAcrylics = currentModelObj?.isSwimSpa ? ACRYLIC_COLORS.filter(c => c.code === 'MB-6427') : ACRYLIC_COLORS;

  const scalePxPerMmOrder = 640 / getModelMaxDimensionMm(currentModelObj?.dimensions || '205');
  const presetModelObj = MODELS.find(m => m.id === presetModelId);
  const scalePxPerMmPreset = 640 / getModelMaxDimensionMm(presetModelObj?.dimensions || '205');

  const groupedParts = placedItems.reduce((acc, item) => {
    if (!acc[item.label]) acc[item.label] = { count: 0, color: item.color };
    acc[item.label].count += 1;
    return acc;
  }, {} as Record<string, { count: number, color: string }>);

  const selectedItemObj = placedItems.find(it => it.id === selectedItemId);
  const isSelectedPanel = selectedItemObj?.shape === 'oval' || selectedItemObj?.shape === 'rect';

  const presetSelectedItemObj = presetPlacedItems.find(it => it.id === presetSelectedItemId);
  const isPresetSelectedPanel = presetSelectedItemObj?.shape === 'oval' || presetSelectedItemObj?.shape === 'rect';

  const renderItemGraphic = (item: PlacedItem, scale: number) => {
    const isOval = item.shape === 'oval';
    const isRect = item.shape === 'rect';

    if (item.type === 'cabinet-led') {
      const w = (item.widthMm || 200) * scale;
      const h = (item.heightMm || 12) * scale;
      return (
        <g filter="drop-shadow(0px 0px 4px #fbbf24)">
          <rect x={-w / 2} y={-h / 2} width={w} height={h} rx={h / 2} fill="#ea580c" />
          <rect x={-w / 2 + 1} y={-h / 2 + 1} width={w - 2} height={h - 2} rx={(h - 2) / 2} fill="#fef08a" />
        </g>
      );
    }

    if (isOval) {
      const w = (item.widthMm || 165) * scale;
      const h = (item.heightMm || 57) * scale;

      if (item.type === 'panel-tp500') {
        return (
          <g>
            <rect x={-w / 2} y={-h / 2} width={w} height={h} rx={h / 2} ry={h / 2} fill="#ea580c" stroke="#fed7aa" strokeWidth="1.5" />
            <rect x={-w * 0.18} y={-h * 0.28} width={w * 0.36} height={h * 0.56} rx="2" fill="#ffffff" />
            <circle cx={-w * 0.34} cy="0" r={h * 0.14} fill="#ffffff" />
            <circle cx={w * 0.34} cy="0" r={h * 0.14} fill="#ffffff" />
          </g>
        );
      }
      return (
        <g>
          <rect x={-w / 2} y={-h / 2} width={w} height={h} rx={h / 2} ry={h / 2} fill="#e2e8f0" stroke="#475569" strokeWidth="1.8" />
          <rect x={-w / 2 + 2} y={-h / 2 + 2} width={w - 4} height={h - 4} rx={(h - 4) / 2} ry={(h - 4) / 2} fill="#0f172a" />
          <rect x={-w * 0.18} y={-h * 0.35} width={w * 0.36} height={h * 0.7} rx="2.5" fill="#0284c7" stroke="#38bdf8" strokeWidth="0.8" />
          <circle cx={-w * 0.36} cy="0" r={h * 0.16} fill="#38bdf8" />
          <circle cx={w * 0.33} cy={-h * 0.22} r={h * 0.13} fill="#38bdf8" />
        </g>
      );
    }

    if (isRect) {
      const w = (item.widthMm || 146) * scale;
      const h = (item.heightMm || 102) * scale;
      return (
        <g>
          <rect x={-w / 2} y={-h / 2} width={w} height={h} rx="5" ry="5" fill="#09090b" stroke="#94a3b8" strokeWidth="1.8" />
          <rect x={-w / 2 + 2.5} y={-h / 2 + 2.5} width={w - 5} height={h - 5} rx="3" ry="3" fill="#0369a1" stroke="#38bdf8" strokeWidth="0.8" />
          <text x="0" y={h * 0.1} textAnchor="middle" fill="#ffffff" fontSize={h * 0.22} fontWeight="bold" fontFamily="sans-serif">ST4</text>
        </g>
      );
    }

    if (item.type === 'mini-led') {
      const r = (item.diameterMm * scale) / 2;
      return (
        <g>
          <circle r={r + 1.5} fill="#14532d" opacity="0.4" />
          <circle r={r} fill="#16a34a" stroke="#ffffff" strokeWidth="1" filter="drop-shadow(0px 0px 3px #22c55e)" />
          <circle r={r * 0.4} fill="#ffffff" />
        </g>
      );
    }

    if (item.type === 'skimmer') {
      const r = (item.diameterMm * scale) / 2;
      return (
        <g>
          <circle r={r} fill="#0f172a" stroke="#ffffff" strokeWidth="2" filter="drop-shadow(0px 3px 6px rgba(0,0,0,0.4))" />
          <text x="0" y="-3" textAnchor="middle" fill="#ffffff" fontSize="9" fontWeight="bold" fontFamily="sans-serif">סקימר</text>
          <text x="0" y="9" textAnchor="middle" fill="#ffffff" fontSize="9" fontWeight="bold" fontFamily="sans-serif">מצוף</text>
        </g>
      );
    }

    if (item.type === 'drain') {
      const r = (item.diameterMm * scale) / 2;
      return (
        <g>
          <circle r={r} fill="#6b21a8" stroke="#ffffff" strokeWidth="1.5" />
          <circle r={r * 0.5} fill="#4c1d95" />
        </g>
      );
    }

    if (item.type === 'air-control') {
      const r = (item.diameterMm * scale) / 2;
      return (
        <g>
          <circle r={r} fill="#94a3b8" stroke="#475569" strokeWidth="1.5" />
          <circle r={r * 0.6} fill="#64748b" />
          <line x1="0" y1={-r * 0.5} x2="0" y2={r * 0.5} stroke="#ffffff" strokeWidth="1.5" />
        </g>
      );
    }

    const visualRadius = (item.diameterMm * scale) / 2;
    return (
      <g>
        <circle r={visualRadius} fill={item.color} stroke="#ffffff" strokeWidth={visualRadius > 10 ? "1.5" : "0.75"} filter="drop-shadow(0px 2px 4px rgba(0,0,0,0.4))" />
        <circle cx={-visualRadius * 0.3} cy={-visualRadius * 0.3} r={visualRadius * 0.4} fill="#ffffff" opacity="0.35" />

                      <div className="flex justify-between items-start mb-3">
                        <div><span className="font-mono font-bold text-lg text-slate-900">{order.serialDigits ? `ספא מס׳ ${order.serialDigits}` : 'טיוטה מכירתית'}</span><div className="text-xs font-bold text-blue-600">{model?.name}</div><div className="text-xs text-slate-500">{order.customerName}</div></div>
                        <span className={`px-2.5 py-1 rounded-lg text-xs font-bold ${isDraft ? 'bg-amber-100 text-amber-800 border border-amber-200' : 'bg-emerald-100 text-emerald-800 border border-emerald-200'}`}>{isDraft ? 'טיוטה פתוחה' : 'פקודה סגורה'}</span>
                      </div>
                      <div className="space-y-1.5 text-xs text-slate-600 my-4 border-t border-b border-slate-100 py-3">
                        <div className="flex items-center gap-1.5"><Clock size={14} className="text-slate-400" /> <span dir="ltr">{date}</span></div>
                        <div className="flex items-center gap-1.5"><Zap size={14} className="text-slate-400" /> {order.selectedPhase === 'three' ? 'תלת פאזי' : 'חד פאזי'}</div>
                        <div className="flex items-center gap-1.5"><Layers size={14} className="text-slate-400" /> קידוחים במערכת: {order.placedItems.length}</div>
                      </div>
                    </div>
                    <div className="flex gap-2 pt-2">
                      <button onClick={() => loadOrder(order)} className="flex-1 bg-blue-50 text-blue-700 hover:bg-blue-100 py-2.5 rounded-xl text-xs font-bold transition cursor-pointer">{isDraft ? 'המשך עריכה' : 'צפה בטופס'}</button>
                      <button onClick={() => deleteOrder(order.id)} className="p-2.5 text-red-400 hover:text-red-600 hover:bg-red-50 rounded-xl transition cursor-pointer"><Trash2 size={16} /></button>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </main>
      )}

      {activeTab === 'presets' && (
        <div className="flex flex-1 w-full overflow-hidden bg-slate-100">
          <aside className="w-80 border-l border-slate-300 bg-white p-5 flex flex-col shadow-xl z-10 overflow-y-auto shrink-0">
            <div className="mb-6">
              <h2 className="text-lg font-bold text-slate-800 flex items-center gap-2 mb-2">
                <Settings className="text-slate-600" />
                עורך תבניות יצרן
              </h2>
              <p className="text-xs text-slate-500 leading-tight">בחר דגם, ערוך את הג'טים והיניקות ושמור תבנית למפעל.</p>
            </div>

            <div className="space-y-4 flex-1">
              <div className="space-y-1.5">
                <label className="text-xs font-bold text-slate-700">בחר דגם:</label>
                <select
                  value={presetModelId}
                  onChange={(e) => {
                    const m = MODELS.find(x => x.id === e.target.value);
                    setPresetModelId(e.target.value);
                    if (m && m.equipments.length > 0) {
                      setPresetEquipmentSku(m.equipments[0].sku);
                      setPresetPlacedItems(getLayoutFor(e.target.value, m.equipments[0].sku, presets));
                    }
                  }}
                  className="w-full p-2.5 rounded-lg border border-slate-300 bg-slate-50 text-sm font-semibold focus:border-slate-800 outline-none"
                >
                  {MODELS.map(m => <option key={m.id} value={m.id}>{m.name} ({m.dimensions})</option>)}
                </select>
              </div>

              <div className="space-y-1.5">
                <label className="text-xs font-bold text-slate-700">בחר רמת איבזור לדגם זה:</label>
                <select
                  value={presetEquipmentSku}
                  onChange={(e) => {
                    setPresetEquipmentSku(e.target.value);
                    setPresetPlacedItems(getLayoutFor(presetModelId, e.target.value, presets));
                  }}
                  className="w-full p-2.5 rounded-lg border border-slate-300 bg-slate-50 text-sm focus:border-slate-800 outline-none"
                >
                  {presetModelObj?.equipments.map(eq => <option key={eq.sku} value={eq.sku}>{eq.name} ({eq.sku})</option>)}
                </select>
              </div>

              {isPresetSelectedPanel && (
                <button onClick={() => presetSelectedItemId && rotatePresetItem(presetSelectedItemId)} className="w-full flex items-center justify-center gap-2 py-2 px-3 rounded-lg bg-blue-50 text-blue-700 border border-blue-200 text-xs font-bold hover:bg-blue-100 transition cursor-pointer">
                  <RotateCw size={14} /> סובב אלמנט ב-90°
                </button>
              )}

              <div className="bg-slate-800 h-px w-full my-4 opacity-10"></div>

              <div>
                <h2 className="text-xs font-bold text-slate-600 uppercase tracking-wider mb-2 flex justify-between">
                  <span>ארגז כלים משרטוט</span>
                  <span className="text-[10px] bg-slate-200 px-1.5 py-0.5 rounded text-slate-600">קנה מידה 1:1</span>
                </h2>
                <div className="space-y-1.5 max-h-64 overflow-y-auto pr-1">
                  {JETS_TOOLS.map((t) => (
                    <button key={t.type} onClick={() => addJetToPreset(t)} className="w-full flex items-center justify-between p-2 rounded-lg border border-slate-200 bg-white hover:bg-slate-100 transition text-right cursor-pointer">
                      <div className="flex items-center gap-2">
                        {t.shape === 'rect' ? (
                           <span className="w-4 h-1.5 rounded-sm shadow-sm border border-slate-300 shrink-0" style={{ backgroundColor: t.color }}></span>
                        ) : (
                           <span className="w-3 h-3 rounded-full shadow-sm border border-slate-300 shrink-0" style={{ backgroundColor: t.color }}></span>
                        )}
                        <span className="text-xs font-semibold text-slate-700">{t.label}</span>
                      </div>
                      <span className="text-[10px] font-mono font-bold text-slate-500">
                        {t.widthMm ? `${t.widthMm}x${t.heightMm}` : `Ø${t.diameterMm}`}
                      </span>
                    </button>
                  ))}
                </div>
              </div>
            </div>

            <div className="space-y-2 pt-4 border-t border-slate-200 mt-4 shrink-0">
              <button onClick={clearPresetCanvas} className="w-full py-2 rounded-lg bg-white border border-slate-300 text-slate-600 hover:bg-slate-50 text-xs font-bold transition cursor-pointer">
                נקה את כל המשטח
              </button>
              <button onClick={savePreset} className="w-full flex items-center justify-center gap-2 py-3.5 rounded-xl bg-slate-800 hover:bg-slate-900 text-white font-bold text-sm shadow-md transition cursor-pointer">
                <Save size={16} /> שמור תבנית יצרן
              </button>
            </div>
          </aside>

          <main className="flex-1 flex flex-col items-center justify-center p-6">
            <div className="flex items-center justify-between bg-white px-5 py-2.5 rounded-xl border border-slate-300 shadow-sm mb-3 w-[580px]">
              <div className="flex items-center gap-2.5">
                <span className="font-bold text-slate-800 text-sm">עריכת תבנית: {presetModelObj?.name}</span>
                <span className="bg-slate-100 text-slate-600 text-xs font-mono px-2 py-0.5 rounded border border-slate-200">SKU: {presetEquipmentSku}</span>
              </div>
              <div className="text-xs text-slate-500 font-medium">סה״כ רכיבים: <span className="font-mono font-bold text-slate-800">{presetPlacedItems.length}</span></div>
            </div>

            <div className="relative rounded-2xl border-4 border-slate-300 bg-white shadow-2xl p-2 border-dashed">
              <svg ref={presetSvgRef} viewBox="0 0 640 640" className="w-[580px] h-[580px] select-none touch-none rounded-xl" onPointerMove={handlePresetPointerMove} onPointerUp={handlePresetPointerUp} onClick={() => setPresetSelectedItemId(null)}>
                <image href={presetModelImageSrc} x="0" y="0" width="640" height="640" preserveAspectRatio="xMidYMid meet" />

                {presetPlacedItems.map((item) => {
                  const isSelected = presetSelectedItemId === item.id;
                  const isNonCircle = item.shape === 'oval' || item.shape === 'rect';
                  const w = isNonCircle ? (item.widthMm || 165) * scalePxPerMmPreset : (item.diameterMm * scalePxPerMmPreset);
                  const h = isNonCircle ? (item.heightMm || 57) * scalePxPerMmPreset : (item.diameterMm * scalePxPerMmPreset);
                  const visualRadius = Math.max(w, h) / 2;
                  const touchRadius = Math.max(visualRadius, 14);

                  return (
                    <g
                      key={item.id}
                      transform={`translate(${item.x}, ${item.y}) rotate(${item.rotation || 0})`}
                      className="cursor-move"
                      onPointerDown={(e) => handlePresetPointerDown(item, e)}
                      onContextMenu={(e) => { e.preventDefault(); e.stopPropagation(); setPresetPlacedItems(prev => prev.filter(it => it.id !== item.id)); }}
                      onDoubleClick={(e) => { e.stopPropagation(); setPresetPlacedItems(prev => prev.filter(it => it.id !== item.id)); }}
                    >
                      <circle r={touchRadius} fill="transparent" />

                      {isSelected && (
                        isNonCircle ? <rect x={-w / 2 - 4} y={-h / 2 - 4} width={w + 8} height={h + 8} rx="6" fill="none" stroke="#334155" strokeWidth="2" strokeDasharray="3,3" /> : <circle r={visualRadius + 4} fill="none" stroke="#334155" strokeWidth="2" strokeDasharray="3,3" />
                      )}

                      {renderItemGraphic(item, scalePxPerMmPreset)}

                      {isSelected && (
                        <g>
                          <rect x="-45" y={h / 2 + 6} width="90" height="22" rx="4" fill="rgba(15, 23, 42, 0.9)" />
                          <text x="0" y={h / 2 + 16} textAnchor="middle" fill="#ffffff" fontSize={8} fontWeight="bold" fontFamily="sans-serif">{item.label}</text>
                          <text x="0" y={h / 2 + 24} textAnchor="middle" fill="#cbd5e1" fontSize={7} fontFamily="monospace" fontWeight="bold">
                            {isNonCircle ? `${item.widthMm}x${item.heightMm}mm` : `Ø${item.diameterMm}mm`}
                          </text>

                          <g className="cursor-pointer" onClick={(e) => { e.stopPropagation(); setPresetPlacedItems(prev => prev.filter(it => it.id !== item.id)); }} onPointerDown={(e) => e.stopPropagation()}>
                            <circle cx={w / 2 + 8} cy={-h / 2 - 8} r="8" fill="#ef4444" stroke="#ffffff" strokeWidth="1.5" />
                            <line x1={w / 2 + 5} y1={-h / 2 - 11} x2={w / 2 + 11} y2={-h / 2 - 5} stroke="#ffffff" strokeWidth="1.5" strokeLinecap="round" />
                            <line x1={w / 2 + 11} y1={-h / 2 - 11} x2={w / 2 + 5} y2={-h / 2 - 5} stroke="#ffffff" strokeWidth="1.5" strokeLinecap="round" />
                          </g>

                          {isNonCircle && (
                            <g className="cursor-pointer" onClick={(e) => { e.stopPropagation(); rotatePresetItem(item.id); }} onPointerDown={(e) => e.stopPropagation()}>
                              <circle cx={-w / 2 - 8} cy={-h / 2 - 8} r="8" fill="#3b82f6" stroke="#ffffff" strokeWidth="1.5" />
                              <path d={`M ${-w / 2 - 11} ${-h / 2 - 8} A 3 3 0 1 1 ${-w / 2 - 6} ${-h / 2 - 6}`} fill="none" stroke="#ffffff" strokeWidth="1.2" strokeLinecap="round" />
                            </g>
                          )}
                        </g>
                      )}
                    </g>
                  );
                })}
              </svg>
            </div>
          </main>
        </div>
      )}

      {zoomImage && (
        <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-6" onClick={() => setZoomImage(null)}>
          <button type="button" onClick={() => setZoomImage(null)} className="absolute top-5 left-5 bg-white/90 hover:bg-white text-slate-800 rounded-full p-2.5 shadow-lg cursor-pointer">
            <X size={22} />
          </button>
          <img src={zoomImage} alt="הגדלת תמונה" className="max-w-full max-h-full rounded-2xl shadow-2xl" onClick={(e) => e.stopPropagation()} />
        </div>
      )}
    </div>
  );
}

const container = document.getElementById("root");
createRoot(container).render(<SpaProductionPage />);
  </script>

  <script>
    const source = document.getElementById('app-source').textContent;
    const output = Babel.transform(source, {
      presets: [["typescript", { isTSX: true, allExtensions: true }], "react"],
      filename: "app.tsx",
      sourceType: "module"
    }).code;
    const script = document.createElement('script');
    script.type = 'module';
    script.textContent = output;
    document.body.appendChild(script);
  </script>
</body>
</html>
